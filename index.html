<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Que Onda! </title>
    <meta name="description" content="El programa de radio en español de Wellington">
    <meta name="keywords" content="español, radio, noticias, actividades">
    <meta name="author" content="ArmandoNZ">
    <link rel="icon" href="FavQueOnda.png" type="image/gif" sizes="16x16">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css" integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="https://static.krp.co.nz/assets/player-assets/video-js.css" />
    <link rel="stylesheet" href="https://static.krp.co.nz/assets/live-stream-assets/accessmedia-live.css" />

    <style>
        body {
            background-color: orange;
        }

        .icon-bar a {
            display: inline-block;
            text-align: center;
            padding: 20px;
            transition: all 0.3s ease;
            color: white;
            font-size: 20px;
        }

        .icon-bar a:hover {
            background-color: #000;
            color: white;
        }

        .facebook { background: #3B5998; }
        .instagram { background: #833AB4; }
        .mixcloud { background: #007bb5; }
        .AccessRadio { background: #bb0000; }
        .envelope { background: #dd4b39; }
        
        h2 {
            font-family: Verdana, Geneva, sans-serif;
        }

        @media screen and (min-width: 601px) {
            h2.example { font-size: 30px; }
        }
        @media screen and (max-width: 600px) {
            h2.example { font-size: 25px; }
        }
        @media screen and (max-width: 375px) {
            h2.example { font-size: 20px; }
        }

        .footer {
            text-align: center;
            margin-top: 30px;
        }
    </style>
</head>
<body>

<div class="container text-center py-4">
    <!-- Header Logo -->
    <div class="row">
        <div class="col-12">
            <img class="img-fluid my-3" src="QueOndaLogoTransparente.png" alt="Que Onda radio en español" title="Que Onda">
        </div>    
        <div class="col-12">
            <h2 class="example">El programa de radio en español de Wellington</h2>
        </div>
    </div>

    <!-- Live Stream Widget Container -->
    <div class="live my-4">
        <div id="accessmedia-livestream-widget"></div>
    </div>
        
    <!-- Podcast Fallback Container -->
    <div class="podcast my-4">
        <iframe width="100%" height="120" src="https://www.mixcloud.com/widget/iframe/?hide_cover=1&feed=%2FRadioQueOnda%2F" frameborder="0"></iframe>
    </div>
</div>

<!-- Footer Elements -->
<div class="footer">
    <div class="container">
        <div class="row icon-bar justify-content-center">
            <a href="https://www.facebook.com/QueOnda.nz/" title="Que Onda @ Facebook" target="_blank" class="facebook"><i class="fa fa-facebook"></i></a>
            <a href="https://www.instagram.com/queonda.nz/" title="Que Onda @ Instagram" target="_blank" class="instagram"><i class="fa fa-instagram"></i></a>
            <a href="mailto:queondalaradio@gmail.com" title="Que Onda @ queondalaradio@gmail.com" target="_blank" class="envelope"><i class="fa fa-envelope"></i></a>
            <a href="https://www.mixcloud.com/RadioQueOnda/" title="Que Onda @ Mixcloud" target="_blank" class="mixcloud"><i class="fa fa-mixcloud"></i></a>
            <a href="https://accessradio.org.nz/shows-podcasts/que-onda/" title="Que Onda @ Access Radio" target="_blank" class="AccessRadio">
                <img src="AccessRadio.svg" style="filter: brightness(0) invert(1);" alt="Access Radio Logo" />
            </a>
        </div>    
    </div>

    <!-- Dynamic Copyright Generation -->
    <div class="py-3">
        <p class="text-secondary">© <span id="copyright-year"></span> - Developed by <a href="http://armando.nz/" target="_blank">Armando.NZ</a></p>
    </div>
</div>

<!-- Scripts -->
<script src="https://ajax.googleapis.com/ajax/libs/jquery/2.1.1/jquery.min.js"></script>
<script type="text/javascript" src="//player.wowza.com/player/latest/wowzaplayer.min.js"></script> 
<script src="https://static.krp.co.nz/assets/live-stream-assets/accessmedia-live.js"></script>
<script src="https://static.krp.co.nz/assets/player-assets/video.min.js"></script>

<script>
    // Initialize Player Widget
    createAudioPlayerWidget(
        'accessmedia-livestream-widget',
        'https://live.accessmedia.nz/Wellington.stream_aac/playlist.m3u8', 
        'https://live.accessmedia.nz/Wellington.stream/playlist.m3u8', 
        '#ff9d00', 
        '#000000' 			
    );

    // Set Dynamic Year
    document.getElementById('copyright-year').textContent = new Date().getFullYear();

    // Content Display Scheduler (Tuesday 18:45 - 20:00 Pacific/Auckland Time)
    var d = new Date(new Date().toLocaleString("en-US", {timeZone: "Pacific/Auckland"}));
    var dayOfWeek = d.getDay();
    var hour = d.getHours();
    var mins = d.getMinutes();
    var isOnline = false;

    if (dayOfWeek === 2) { // Tuesday
        if (hour === 18 && mins >= 45) {
            isOnline = true;
        } else if (hour === 19) {
            isOnline = true;
        }
    }

    if (isOnline) {
        $('.live').show();
        $('.podcast').hide();
    } else {
        $('.live').hide();
        $('.podcast').show();
    }
</script>
</body>
</html>
